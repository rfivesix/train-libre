appId: com.rfivesix.trainlibre
---
- launchApp:
    clearState: true

- tapOn: "0"
- tapOn: 55%, 17%
- tapOn: "Accept & Get Started\nAccept & Get Started\nAccept & Get Started"
- tapOn: "Allow"
- extendedWaitUntil:
    visible: "Restore from Backup\nRestore from Backup\nRestore from Backup"
    timeout: 60000
- tapOn: "Restore from Backup\nRestore from Backup\nRestore from Backup"
- tapOn: "backup.json"
- tapOn: "Open"

# Onboarding Step 1: Unit system
- extendedWaitUntil:
    visible: "NEXT\nNEXT\nNEXT"
    timeout: 60000
- tapOn:
    text: "Metric.*"
    optional: true
- tapOn: "NEXT\nNEXT\nNEXT"

# Onboarding Step 2: Region selection
- tapOn: "United States (US)"
- tapOn: "Germany (DE)"
- tapOn: "NEXT\nNEXT\nNEXT"
- assertVisible: "Download Now\nDownload Now\nDownload Now"
- tapOn: "Download Now\nDownload Now\nDownload Now"

# Onboarding Step 3: AI & Health completion (last page)
- extendedWaitUntil:
    visible: "Continue\nContinue\nContinue"
    timeout: 60000
- tapOn: "Continue\nContinue\nContinue"
- tapOn:
    text: "Allow “Train Libre” to write"
    index: 1
- tapOn: "Don’t Allow"
- tapOn: "Continue\nContinue\nContinue"
- tapOn:
    text: "Allow “Train Libre” to read"
    index: 1
- tapOn: "Don’t Allow"
- tapOn: "Continue\nContinue\nContinue"
- tapOn:
    text: "Allow “Train Libre” to read"
    index: 1
- tapOn: "Don’t Allow"
- tapOn: "Continue\nContinue\nContinue"
- tapOn:
    text: "Allow “Train Libre” to read"
    index: 1
- tapOn: "Don’t Allow"
- tapOn: "START TRACKING\nSTART TRACKING\nSTART TRACKING"
- tapOn: "Skip"


# Navigation to Settings -> Data Backup Screenshot
- tapOn:
    point: 91%,13%
- tapOn: "Settings\nTheme, units, data and more"
- scrollUntilVisible:
    element: "Data backup & import\nCreate backups, restore, and import data."
- tapOn: "Data backup & import\nCreate backups, restore, and import data."
- takeScreenshot: 03_data
- tapOn: "Back"
- tapOn: "Back"
- tapOn: "Back"

# Tabs
- tapOn: 
    text: "Diary"
    optional: true
- takeScreenshot: 01_diary
- tapOn: 
    text: "Nutrition"
    optional: true
- takeScreenshot: 02_nutrition
- tapOn: "Statistics"
- waitForAnimationToEnd
- scrollUntilVisible:
    element: "Body measurements\nAll measurements"
- scroll
- tapOn: "Body measurements\nAll measurements"
- extendedWaitUntil:
    visible: "6M"
    timeout: 60000
- tapOn: "6M"
- takeScreenshot: 04_measurements
- tapOn: "Back"
- scrollUntilVisible:
    element: "Muscle Readiness\nCurrently\nSeveral muscle groups still recovering\n6\nRecovering\n46%\n3\nReady\n23%\n4\nFresh\n31%"
    direction: UP
- tapOn: "Muscle Readiness\nCurrently\nSeveral muscle groups still recovering\n6\nRecovering\n46%\n3\nReady\n23%\n4\nFresh\n31%"

- takeScreenshot: 05_recovery
- tapOn: "Back"

# AI Meal Capture Photo capture
- tapOn:
    point: 90%,90%
- tapOn:
    point: 90%,85%
- tapOn:
    point: 44%,14%
    optional: true
    repeat: 2
    delay: 5000
- tapOn:
    point: 88%,83%
- tapOn:
    text: "Photo, June 01.*"
    optional: true
- tapOn: "Done"
- takeScreenshot: 06_ai
- tapOn: "Back"

# Workout start & log
- tapOn:
    point: 90%,90%
- tapOn:
    point: 90%,70%
- tapOn: # Tap on Pull (intensity)
    text: "Start\nStart\nStart"
    index: 3

- tapOn: "0"
- inputText: "50"
- tapOn: "10-20"
- inputText: "15"
- tapOn:
    point: 91%,33%
- tapOn: "88kg × 5"
- tapOn: "88kg × 10"
- tapOn: "88kg × 9"
- tapOn: 
    text: "1"
    index: 0
- inputText: "1"
- tapOn: "Done"
- tapOn:
    point: 91%,54%
- tapOn:
    point: 91%,59%
- takeScreenshot: 07_runnning_workout
