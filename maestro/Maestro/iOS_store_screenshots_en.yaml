appId: com.rfivesix.trainlibre
---
- launchApp:
    clearState: true

- extendedWaitUntil:
    visible: "Restore from Backup"
    timeout: 60000
- tapOn: "Restore from Backup"
- tapOn: "backup.json"
- tapOn: "Open"

# Onboarding Step 1: Metric unit system
- extendedWaitUntil:
    visible: "NEXT\nNEXT\nNEXT"
    timeout: 60000
- tapOn:
    text: "Metric.*"
    optional: true
- tapOn: "NEXT\nNEXT\nNEXT"

# Onboarding Step 2: Region selection
- tapOn: "United States (US)"
- tapOn: "Germany (DE)"
- tapOn: "NEXT\nNEXT\nNEXT"

# Onboarding Step 3: AI & Health completion (last page)
- tapOn: "START TRACKING\nSTART TRACKING\nSTART TRACKING"

# Navigation to Settings -> Data Backup Screenshot
- tapOn:
    point: 91%,13%
- tapOn: "Settings\nTheme, units, data and more"
- scrollUntilVisible:
    element: "Data backup & import\nCreate backups, restore, and import data."
- tapOn: "Data backup & import\nCreate backups, restore, and import data."
- takeScreenshot: 03_data
- tapOn: "Back"
- tapOn: "Back"
- tapOn: "Back"

# Tabs
- tapOn: 
    text: "Diary"
    optional: true
    repeat: 2
    delay: 10000
- takeScreenshot: 01_diary
- tapOn: 
    text: "Nutrition"
    optional: true
    repeat: 2
    delay: 10000
- takeScreenshot: 02_nutrition
- tapOn: "Statistics"
- scrollUntilVisible:
    element: "Body measurements\nAll measurements"
- scroll
- tapOn: "Body measurements\nAll measurements"
- waitForAnimationToEnd
- takeScreenshot: 04_measurements
- tapOn: "Back"
- scrollUntilVisible:
    element: "Muscle Readiness"
    direction: UP
- tapOn: "Muscle Readiness"
- takeScreenshot: 05_recovery
- tapOn: "Back"

# AI Meal Capture configuration
- tapOn:
    point: 91%,13%
- tapOn: "Settings\nTheme, units, data and more"
- scrollUntilVisible:
    element: "AI Meal Capture\nConfigure AI-powered meal recognition."
- tapOn: "AI Meal Capture\nConfigure AI-powered meal recognition."
- tapOn: "0"
- tapOn: "Back"
- tapOn: "Back"
- tapOn: "Back"

# AI Meal Capture Photo capture
- tapOn:
    point: 80%,90%
- tapOn:
    point: 79%,80%
- tapOn:
    point: 44%,14%
    optional: true
    repeat: 2
    delay: 5000
- tapOn:
    point: 88%,83%
- tapOn:
    text: "Photo, June 01.*"
    optional: true
- tapOn: "Done"
- takeScreenshot: 06_ai
- tapOn: "Back"

# Workout start & log
- tapOn:
    point: 80%,90%
- tapOn:
    point: 79%,61%
- tapOn: # Tap on Pull (intensity)
    text: "Start"
    index: 3
- tapOn: "0"
- inputText: "50"
- tapOn: "10-20"
- inputText: "15"
- tapOn:
    point: 91%,33%
- tapOn: "88kg × 5"
- tapOn: "88kg × 10"
- tapOn: "88kg × 9"
- tapOn: 
    text: "1"
    index: 0
- inputText: "1"
- tapOn: "Done"
- tapOn:
    point: 91%,54%
- tapOn:
    point: 91%,59%
- takeScreenshot: 07_runnning_workout
