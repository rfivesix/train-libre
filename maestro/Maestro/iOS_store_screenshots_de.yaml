appId: com.rfivesix.trainlibre
---
- launchApp:
    clearState: true

- tapOn: "0"
- tapOn: "0"
- tapOn: "Akzeptieren & Loslegen\nAkzeptieren & Loslegen\nAkzeptieren & Loslegen"
- tapOn: "Erlauben"
- extendedWaitUntil:
    visible: "Aus Backup wiederherstellen\nAus Backup wiederherstellen\nAus Backup wiederherstellen"
    timeout: 60000
- tapOn: "Aus Backup wiederherstellen\nAus Backup wiederherstellen\nAus Backup wiederherstellen"
- tapOn: "backup.json"
- tapOn: "Öffnen"

# Onboarding Step 1: Unit system
- extendedWaitUntil:
    visible: "WEITER\nWEITER\nWEITER"
    timeout: 60000
- tapOn:
    text: "Metrisch.*"
    optional: true
- tapOn: "WEITER\nWEITER\nWEITER"

# Onboarding Step 2: Region selection
- tapOn: "Vereinigte Staaten (US)"
- tapOn: "Deutschland (DE)"
- tapOn: "WEITER\nWEITER\nWEITER"
- assertVisible: "Jetzt herunterladen\nJetzt herunterladen\nJetzt herunterladen"
- tapOn: "Jetzt herunterladen\nJetzt herunterladen\nJetzt herunterladen"

# Onboarding Step 3: AI & Health completion (last page)
- extendedWaitUntil:
    visible: "Fortfahren\nFortfahren\nFortfahren"
    timeout: 60000
- tapOn: "Fortfahren\nFortfahren\nFortfahren"
- tapOn:
    text: "„Train Libre“ darf Daten schreiben"
    index: 1
- tapOn: "Nicht erlauben"
- tapOn: "Fortfahren\nFortfahren\nFortfahren"
- tapOn:
    text: "„Train Libre“ darf Daten lesen"
    index: 1
- tapOn: "Nicht erlauben"
- tapOn: "Fortfahren\nFortfahren\nFortfahren"
- tapOn:
    text: "„Train Libre“ darf Daten lesen"
    index: 1
- tapOn: "Nicht erlauben"
- tapOn: "Fortfahren\nFortfahren\nFortfahren"
- tapOn:
    text: "„Train Libre“ darf Daten lesen"
    index: 1
- tapOn: "Nicht erlauben"
- tapOn: "LOSLEGEN\nLOSLEGEN\nLOSLEGEN"
- tapOn: "Überspringen"


# Navigation to Settings -> Data Backup Screenshot
- tapOn:
    point: 91%,13%
- tapOn: "Einstellungen\nThema, Einheiten, Daten und mehr"
- scrollUntilVisible:
    element: "Datensicherung & Import\nBackups erstellen, wiederherstellen und Daten importieren."
- tapOn: "Datensicherung & Import\nBackups erstellen, wiederherstellen und Daten importieren."
- takeScreenshot: 03_data
- tapOn: "Zurück"
- tapOn: "Zurück"
- tapOn: "Zurück"

# Tabs
- tapOn: 
    text: "Tagebuch"
    optional: true
- takeScreenshot: 01_diary
- tapOn: 
    text: "Ernährung"
    optional: true
- takeScreenshot: 02_nutrition
- tapOn: "Statistiken"
- waitForAnimationToEnd
- scrollUntilVisible:
    element: "Körpermaße\nAlle Messwerte"
- scroll
- tapOn: "Körpermaße\nAlle Messwerte"
- extendedWaitUntil:
    visible: "6M"
    timeout: 60000
- tapOn: "6M"
- takeScreenshot: 04_measurements
- tapOn: "Zurück"
- scrollUntilVisible:
    element: "Muskel-Bereitschaft\nAktuell\nMehrere Muskelgruppen sind noch in Erholung\n6\nIn Erholung\n46%\n3\nBereit\n23%\n4\nFrisch\n31%"
    direction: UP
- tapOn: "Muskel-Bereitschaft\nAktuell\nMehrere Muskelgruppen sind noch in Erholung\n6\nIn Erholung\n46%\n3\nBereit\n23%\n4\nFrisch\n31%"

- takeScreenshot: 05_recovery
- tapOn: "Zurück"

# AI Meal Capture Photo capture
- tapOn:
    point: 90%,90%
- tapOn:
    point: 90%,85%
- tapOn:
    point: 44%,14%
    optional: true
    repeat: 2
    delay: 5000
- tapOn:
    point: 88%,83%
- tapOn:
    text: "Foto, 01. Juni.*"
    optional: true
- tapOn: "Fertig"
- takeScreenshot: 06_ai
- tapOn: "Zurück"

# Workout start & log
- tapOn:
    point: 90%,90%
- tapOn:
    point: 90%,70%
- tapOn: # Tap on Pull (intensity)
    text: "Start\nStart\nStart"
    index: 3

- tapOn: "0"
- inputText: "50"
- tapOn: "10-20"
- inputText: "15"
- tapOn:
    point: 91%,33%
- tapOn: "88kg × 5"
- tapOn: "88kg × 10"
- tapOn: "88kg × 9"
- tapOn: 
    text: "1"
    index: 0
- inputText: "1"
- tapOn: "Fertig"
- tapOn:
    point: 91%,54%
- tapOn:
    point: 91%,59%
- takeScreenshot: 07_runnning_workout
