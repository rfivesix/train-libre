name: train_libre
description: "Train Libre is a modern, privacy-first fitness and nutrition
  tracking app. Offline-first, no cloud dependency, built with Flutter."
publish_to: "none"
version: 1.0.2+1000015 #1.0.2-alpha.3+1000015
environment:
  sdk: ">=3.0.0 <4.0.0" # Adjusted for modern SDKs

dependencies:
  flutter:
    sdk: flutter

  # DOC: Added for localization (multilingual support)
  flutter_localizations:
    sdk: flutter
  intl: 0.20.2 # Always check the latest version with `flutter pub outdated`

  # DOC: Added for the SQLite database
  sqflite: ^2.4.3
  path: ^1.8.3

  # cupertino_icons: ^1.0.8
  flutter_gen: ^5.14.1
  shared_preferences: ^2.2.3
  dynamic_color: ^1.7.0
  url_launcher: ^6.2.6
  path_provider: ^2.1.6
  file_picker: ^12.0.0-beta.5
  share_plus: ^13.2.1
  fl_chart: ^1.1.0
  flutter_svg: ^2.3.0
  vibration: ^3.2.0
  csv: ^8.0.0
  provider: ^6.1.5+1
  google_fonts: ^8.2.0
  package_info_plus: ^10.2.1 # or the latest version
  image_picker: ^1.2.2
  cryptography: ^2.7.0
  table_calendar: ^3.2.0

  mime: ^2.0.0
  archive: ^4.0.9
  excel_community: ^1.0.10
  rename_app: ^1.6.6
  soft_edge_blur: ^0.1.3

  # AI Meal Capture (#81)
  http: ^1.2.0
  flutter_secure_storage: ^10.3.0
  flutter_local_notifications: ^22.1.0
  timezone: ^0.11.0
  crypto: ^3.0.5

  figma_squircle: ^0.6.3

  drift: ^2.34.3
  sqlite3_flutter_libs: ^0.6.0+eol
  uuid: ^4.6.0
  json_annotation: ^4.12.0
  qr_code_scanner_plus: ^2.2.0
  permission_handler: ^12.0.3
  flutter_markdown_plus: ^1.0.12
  flutter_markdown_plus_latex: ^1.0.5
  markdown: ^7.3.1
  flutter_body_highlighter:
    git:
      url: https://github.com/rfivesix/flutter_body_highlighter
      ref: main
  liquid_glass_widgets: ^0.24.1
  flutter_lucide: ^1.11.0
  in_app_review: ^2.0.12
  icloud_storage: ^2.0.3
  skeletonizer: ^2.1.3
  workmanager: ^0.9.0+3
  posthog_flutter: ^5.36.0
  audioplayers: ^6.1.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  build_runner: ^2.15.1
  drift_dev: ^2.34.4
# dependency_overrides:

flutter_launcher_icons:
  android: true # Generate the icon for Android
  ios: true # Generate the icon for iOS
  image_path: "assets/icon/train-libre_icon_dark_bg.png" # Path to the main icon

flutter:
  # DOC: This flag is required. It tells Flutter to generate the
  # localization code automatically.
  generate: true
  uses-material-design: true

  assets:
    - assets/icon/train-libre_icon_dark_green_no_bg.svg
    - assets/db/
    - assets/privacy/
    - assets/legal/
    - assets/sounds/
    - documentation/features/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400 # Regular
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500 # Medium
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600 # SemiBold
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700 # Bold
        - asset: assets/fonts/Inter-ExtraBold.ttf
          weight: 800 # ExtraBold
        - asset: assets/fonts/Inter-Black.ttf
          weight: 900 # Black
        - asset: assets/fonts/Inter-Italic.ttf
          style: italic
        - asset: assets/fonts/Inter-BoldItalic.ttf
          weight: 700
          style: italic
