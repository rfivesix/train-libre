name: train_libre
description: "Train Libre is a modern, privacy-first fitness and nutrition
  tracking app. Offline-first, no cloud dependency, built with Flutter."
publish_to: "none"
version: 1.7.1-beta.4+1007032
environment:
  sdk: ">=3.14.0 <4.0.0"
  flutter: ">=3.50.0"

dependencies:
  flutter:
    sdk: flutter

  # DOC: Added for localization (multilingual support)
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.3 # Must track flutter_localizations from the active Flutter SDK.

  # DOC: Added for the SQLite database
  sqflite: ^2.4.6
  path: ^1.9.1

  cupertino_icons: ^2.0.0
  flutter_gen: ^5.15.0
  shared_preferences: ^2.5.6
  dynamic_color: ^2.1.0
  url_launcher: ^6.3.3
  path_provider: ^2.1.6
  file_picker: ^13.3.3
  share_plus: ^13.3.1
  fl_chart: ^1.3.1
  flutter_svg: ^2.3.4
  vibration: ^3.2.1
  csv: ^8.0.0
  provider: ^6.1.5+1
  google_fonts: ^9.0.0
  package_info_plus: ^10.2.2 # or the latest version
  # Device model for the performance section of the feedback report: "9.7% jank"
  # is far less useful without knowing which iPhone produced it.
  device_info_plus: ^13.3.0
  image_picker: ^1.2.4
  cryptography: ^2.9.0
  table_calendar: ^3.3.0

  mime: ^2.1.0
  archive: ^4.6.0
  excel_community: ^2.6.2
  soft_edge_blur: ^0.1.3

  # AI Meal Capture (#81)
  http: ^1.6.0
  # Version 11 removes the Android migration path for older encrypted data.
  # Users may skip releases, so retain v10 until a safe migration is possible.
  flutter_secure_storage: ^10.3.4
  flutter_local_notifications: ^23.0.1
  timezone: ^0.11.2
  crypto: ^3.0.8

  figma_squircle: ^0.6.3

  drift: ^2.35.4
  sqlite3: ^3.9.1
  sqlparser: ^0.45.1
  sqlite3_flutter_libs: ^0.6.0+eol
  uuid: ^4.6.0
  json_annotation: ^4.12.0
  qr_code_scanner_plus: ^2.3.2
  permission_handler: ^13.0.2
  flutter_markdown_plus: ^1.0.12
  flutter_markdown_plus_latex: ^1.0.5
  markdown: ^7.3.1
  flutter_body_highlighter:
    git:
      url: https://github.com/rfivesix/flutter_body_highlighter
      ref: main
  liquid_glass_widgets: ^1.17.3
  flutter_lucide: ^1.71.0 # 1.38 renamed LucideIcons.history to rotate_ccw_clock
  icloud_storage: ^2.2.0
  skeletonizer: ^3.0.0
  workmanager: ^0.10.10
  posthog_flutter: ^5.60.1
  audioplayers: ^6.8.1
  speech_to_text: ^7.5.0
  cupertino_ui: any
  material_ui: any
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  build_runner: ^2.17.1
  drift_dev: ^2.35.3
  # Imported directly by the camera/permission widget tests, which mock the
  # platform interfaces rather than the plugin facades.
  permission_handler_platform_interface: ^4.4.1
  plugin_platform_interface: ^2.1.8
  # Real SQLite for the catalog contract test. The importer opens its source
  # through sqflite, so a fixture run needs a host factory rather than the
  # mocked platform channel the other tests use.
  sqflite_common_ffi: ^2.4.7
# dependency_overrides:

flutter_launcher_icons:
  android: true # Generate the icon for Android
  ios: true # Generate the icon for iOS
  image_path: "assets/icon/train-libre_icon_dark_bg.png" # Path to the main icon

flutter:
  # DOC: This flag is required. It tells Flutter to generate the
  # localization code automatically.
  generate: true
  uses-material-design: true

  assets:
    - assets/icon/train-libre_icon_dark_green_no_bg.svg
    - assets/db/catalog_manifest.json
    - assets/db/train_libre_training.db
    - assets/privacy/
    - assets/legal/
    - assets/sounds/
    - documentation/features/
    - documentation/user_guide/
    - documentation/developer/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400 # Regular
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500 # Medium
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600 # SemiBold
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700 # Bold
        - asset: assets/fonts/Inter-ExtraBold.ttf
          weight: 800 # ExtraBold
        - asset: assets/fonts/Inter-Black.ttf
          weight: 900 # Black
        - asset: assets/fonts/Inter-Italic.ttf
          style: italic
        - asset: assets/fonts/Inter-BoldItalic.ttf
          weight: 700
          style: italic
