version: 2

updates:
  - package-ecosystem: "pub"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "dart"
      - "flutter"
    commit-message:
      prefix: "deps"
    groups:
      flutter-dart-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "main"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:30"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "deps"
    groups:
      github-actions:
        patterns:
          - "*"

  # Keep the Android build toolchain current in a reviewable PR instead of
  # discovering an unsupported Gradle/AGP version during a release build.
  - package-ecosystem: "gradle"
    directory: "/android"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:15"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
      - "android"
      - "gradle"
    commit-message:
      prefix: "deps"
