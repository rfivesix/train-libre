name: Update F-Droid Repository

on:
  release:
    types: [published, released]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update-fdroid-repo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'

      - name: Setup Java JDK
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install fdroidserver and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y apksigner xmlsec1
          pip install fdroidserver

      - name: Initialize F-Droid Repository Structure
        run: |
          mkdir -p fdroid/repo
          mkdir -p fdroid/metadata
          cp fdroid-config/config.yml fdroid/config.yml
          chmod 0600 fdroid/config.yml

      - name: Download Release APKs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="${{ github.event.release.tag_name }}"
          if [ -z "$TAG_NAME" ]; then
            echo "Manual trigger detected. Fetching assets from the latest release..."
            gh release download --pattern "*.apk" --dir fdroid/repo --skip-existing
          else
            echo "Release trigger detected for tag: $TAG_NAME"
            gh release download "$TAG_NAME" --pattern "*.apk" --dir fdroid/repo --skip-existing
          fi

      - name: Decode F-Droid Keystore
        env:
          FDROID_KEYSTORE_BASE64: ${{ secrets.FDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$FDROID_KEYSTORE_BASE64" ]; then
            echo "Error: FDROID_KEYSTORE_BASE64 is not set."
            exit 1
          fi
          echo "$FDROID_KEYSTORE_BASE64" | base64 --decode > fdroid/fdroid.jks

      - name: Configure F-Droid settings
        env:
          KEYSTORE_PASSWORD: ${{ secrets.FDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.FDROID_KEY_PASSWORD }}
        run: |
          REPO_NAME="${{ github.event.repository.name }}"
          REPO_URL="https://${{ github.repository_owner }}.github.io/$REPO_NAME/fdroid/repo"
          REPO_DISPLAY_NAME="$REPO_NAME F-Droid Repo"
          REPO_DESC="Automated F-Droid repository for $REPO_NAME"

          cd fdroid
          sed -i "s|REPO_URL_PLACEHOLDER|$REPO_URL|g" config.yml
          sed -i "s|REPO_NAME_PLACEHOLDER|$REPO_DISPLAY_NAME|g" config.yml
          sed -i "s|REPO_DESC_PLACEHOLDER|$REPO_DESC|g" config.yml

          # Use Python for password injection - safe with any special characters in the password
          python3 -c "import os; c = open('config.yml').read(); c = c.replace('KEYSTORE_PASS_PLACEHOLDER', os.environ['KEYSTORE_PASSWORD']); c = c.replace('KEY_PASS_PLACEHOLDER', os.environ['KEY_PASSWORD']); open('config.yml', 'w').write(c)"

      - name: Dynamic Changelog Injection & Fastlane Metadata Bridge
        env:
          RELEASE_BODY: ${{ github.event.release.body }}
        run: |
          # 1. Parse build number from pubspec.yaml, update F-Droid metadata, and dump release body into changelogs
          python3 -c '
          import os, re
          with open("pubspec.yaml", "r") as f:
              pubspec = f.read()
          match = re.search(r"^version:\s*([^\n\+]+)\+(\d+)", pubspec, re.M)
          if not match:
              raise ValueError("Could not find version and build number in pubspec.yaml")
          version_name = match.group(1)
          build_number = match.group(2)
          print(f"Extracted active version: {version_name}, build number: {build_number}")
          
          metadata_path = "fdroid/metadata/com.rfivesix.trainlibre.yml"
          if os.path.exists(metadata_path):
              with open(metadata_path, "r") as f:
                  metadata = f.read()
              
              metadata = re.sub(r"^CurrentVersion:\s*[^\n]+", f"CurrentVersion: {version_name}", metadata, flags=re.M)
              metadata = re.sub(r"^CurrentVersionCode:\s*[^\n]+", f"CurrentVersionCode: {build_number}", metadata, flags=re.M)
              
              build_entry_pattern = rf"versionCode:\s*{build_number}"
              if not re.search(build_entry_pattern, metadata):
                  build_entry = f"\n  - versionName: {version_name}\n    versionCode: {build_number}\n    commit: v{version_name}\n    gradle:\n      - yes"
                  if "Builds:" in metadata:
                      metadata = metadata.replace("Builds:", f"Builds:{build_entry}")
                  else:
                      metadata += f"\nBuilds:{build_entry}"
              
              with open(metadata_path, "w") as f:
                  f.write(metadata)
              print("F-Droid metadata updated successfully.")
          else:
              print(f"Warning: F-Droid metadata file not found at {metadata_path}")
          
          release_body = os.environ.get("RELEASE_BODY", "")
          if not release_body:
              release_body = "Automated release update. Please check CHANGELOG.md for details."
          
          metadata_dir = "fastlane/metadata/android"
          if os.path.exists(metadata_dir):
              for locale in os.listdir(metadata_dir):
                  changelog_dir = os.path.join(metadata_dir, locale, "changelogs")
                  if os.path.isdir(changelog_dir):
                      changelog_file = os.path.join(changelog_dir, f"{build_number}.txt")
                      with open(changelog_file, "w") as f:
                          f.write(release_body)
                      print(f"Injected release notes into: {changelog_file}")
          '


          # 2. Bridge Fastlane metadata directory to fdroid workspace to inherit store descriptions
          echo "Bridging Fastlane metadata into F-Droid repo structure..."
          # Copy to root level of F-Droid (fdroid/fastlane/metadata/android)
          mkdir -p fdroid/fastlane
          cp -r fastlane/metadata fdroid/fastlane/
          
          # Also copy to package level under fdroid/metadata/com.rfivesix.trainlibre/
          mkdir -p fdroid/metadata/com.rfivesix.trainlibre
          cp -r fastlane/metadata fdroid/metadata/com.rfivesix.trainlibre/

          # 3. Copy iOS screenshots into F-Droid metadata locations instead of Android screenshots
          python3 -c '
          import os, shutil
          ios_root = "assets/screenshots/iOS"
          keys = ["diary", "nutrition", "data", "measurements", "recovery", "ai", "running_workout"]
          if os.path.exists(ios_root):
              for locale in os.listdir(ios_root):
                  locale_path = os.path.join(ios_root, locale)
                  if not os.path.isdir(locale_path):
                      continue
                  theme = "light"
                  theme_path = os.path.join(locale_path, theme)
                  if not os.path.exists(theme_path):
                      theme = "dark"
                      theme_path = os.path.join(locale_path, theme)
                  if not os.path.exists(theme_path):
                      continue
                  print(f"Copying iOS screenshots ({theme}) for locale {locale}...")
                  dest1 = f"fdroid/fastlane/metadata/android/{locale}/images/phoneScreenshots"
                  dest2 = f"fdroid/metadata/com.rfivesix.trainlibre/metadata/android/{locale}/images/phoneScreenshots"
                  os.makedirs(dest1, exist_ok=True)
                  os.makedirs(dest2, exist_ok=True)
                  
                  # Clean existing png files in destination
                  for d in [dest1, dest2]:
                      for f in os.listdir(d):
                          if f.lower().endswith(".png"):
                              os.remove(os.path.join(d, f))
                              
                  for idx, key in enumerate(keys):
                      src_file = os.path.join(theme_path, f"iOS_{theme}_{key}.png")
                      if os.path.exists(src_file):
                          filename = f"{idx+1:02d}.png"
                          shutil.copy(src_file, os.path.join(dest1, filename))
                          shutil.copy(src_file, os.path.join(dest2, filename))
                          print(f"  Mapped {src_file} -> {filename}")
                      else:
                          print(f"  Warning: Expected file not found: {src_file}")
          else:
              print("Warning: assets/screenshots/iOS directory not found.")
          '

      - name: Update F-Droid Repository Metadata
        env:
          FDROID_KEY_STORE_PASS: ${{ secrets.FDROID_KEYSTORE_PASSWORD }}
          FDROID_KEY_PASS: ${{ secrets.FDROID_KEY_PASSWORD }}
        run: |
          cd fdroid
          fdroid update --create-metadata -v

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./fdroid/repo
          publish_branch: gh-pages
          destination_dir: fdroid/repo
          keep_files: true
