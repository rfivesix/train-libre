name: Update F-Droid Repository

on:
  release:
    types: [published]
  workflow_dispatch:

# Shared with deploy-docs.yml: both workflows push to the same branch.
concurrency:
  group: gh-pages-publish
  queue: max
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update-fdroid-repo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Resolve release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [ -n "$RELEASE_TAG" ]; then
            gh release view "$RELEASE_TAG" --json tagName,body > "$RUNNER_TEMP/fdroid-release.json"
          else
            echo "Manual trigger detected. Resolving the latest release..."
            gh release view --json tagName,body > "$RUNNER_TEMP/fdroid-release.json"
          fi
          TAG_NAME=$(jq -er '.tagName | select(length > 0)' "$RUNNER_TEMP/fdroid-release.json")
          echo "tag=$TAG_NAME" >> "$GITHUB_OUTPUT"

      # Keep the workflow/config from the selected branch, but use the same
      # release tag for APKs, pubspec, store metadata, and screenshots.
      - name: Checkout release metadata
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ steps.release.outputs.tag }}
          path: release-source
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'

      - name: Setup Java JDK
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install fdroidserver and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y apksigner xmlsec1
          pip install fdroidserver

      - name: Test repository workflow configuration
        run: python3 .github/scripts/test_fdroid_workflows.py

      - name: Initialize F-Droid Repository Structure
        run: |
          mkdir -p fdroid/repo
          mkdir -p fdroid/metadata
          cp fdroid-config/config.yml fdroid/config.yml
          chmod 0600 fdroid/config.yml

      - name: Download Release APKs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ steps.release.outputs.tag }}
        run: |
          gh release download "$TAG_NAME" --pattern "*.apk" --dir fdroid/repo

      - name: Decode F-Droid Keystore
        env:
          FDROID_KEYSTORE_BASE64: ${{ secrets.FDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$FDROID_KEYSTORE_BASE64" ]; then
            echo "Error: FDROID_KEYSTORE_BASE64 is not set."
            exit 1
          fi
          echo "$FDROID_KEYSTORE_BASE64" | base64 --decode > fdroid/fdroid.jks

      - name: Configure F-Droid settings
        env:
          KEYSTORE_PASSWORD: ${{ secrets.FDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.FDROID_KEY_PASSWORD }}
        run: |
          REPO_NAME="${{ github.event.repository.name }}"
          REPO_URL="https://trainlibre.com/fdroid/repo"
          REPO_DISPLAY_NAME="$REPO_NAME F-Droid Repo"
          REPO_DESC="Automated F-Droid repository for $REPO_NAME"

          cd fdroid
          sed -i "s|REPO_URL_PLACEHOLDER|$REPO_URL|g" config.yml
          sed -i "s|REPO_NAME_PLACEHOLDER|$REPO_DISPLAY_NAME|g" config.yml
          sed -i "s|REPO_DESC_PLACEHOLDER|$REPO_DESC|g" config.yml

          # Use Python for password injection - safe with any special characters in the password
          python3 -c "import os; c = open('config.yml').read(); c = c.replace('KEYSTORE_PASS_PLACEHOLDER', os.environ['KEYSTORE_PASSWORD']); c = c.replace('KEY_PASS_PLACEHOLDER', os.environ['KEY_PASSWORD']); open('config.yml', 'w').write(c)"

      - name: Dynamic Changelog Injection & Fastlane Metadata Bridge
        run: |
          # 1. Use the resolved release, not the workflow branch, for version and changelogs.
          python3 -c '
          import json, os, re
          with open("release-source/pubspec.yaml", "r") as f:
              pubspec = f.read()
          match = re.search(r"^version:\s*([^\n\+]+)\+(\d+)", pubspec, re.M)
          if not match:
              raise ValueError("Could not find version and build number in pubspec.yaml")
          version_name = match.group(1)
          build_number = match.group(2)
          print(f"Extracted active version: {version_name}, build number: {build_number}")
          
          metadata_path = "fdroid/metadata/com.rfivesix.trainlibre.yml"
          if os.path.exists(metadata_path):
              with open(metadata_path, "r") as f:
                  metadata = f.read()
              
              metadata = re.sub(r"^CurrentVersion:\s*[^\n]+", f"CurrentVersion: {version_name}", metadata, flags=re.M)
              metadata = re.sub(r"^CurrentVersionCode:\s*[^\n]+", f"CurrentVersionCode: {build_number}", metadata, flags=re.M)
              
              build_entry_pattern = rf"versionCode:\s*{build_number}"
              if not re.search(build_entry_pattern, metadata):
                  build_entry = f"\n  - versionName: {version_name}\n    versionCode: {build_number}\n    commit: v{version_name}\n    gradle:\n      - yes"
                  if "Builds:" in metadata:
                      metadata = metadata.replace("Builds:", f"Builds:{build_entry}")
                  else:
                      metadata += f"\nBuilds:{build_entry}"
              
              with open(metadata_path, "w") as f:
                  f.write(metadata)
              print("F-Droid metadata updated successfully.")
          else:
              print(f"Warning: F-Droid metadata file not found at {metadata_path}")
          
          with open(os.path.join(os.environ["RUNNER_TEMP"], "fdroid-release.json")) as f:
              release_body = json.load(f).get("body", "")
          if not release_body:
              release_body = "Automated release update. Please check CHANGELOG.md for details."
          
          metadata_dir = "release-source/fastlane/metadata/android"
          if os.path.exists(metadata_dir):
              for locale in os.listdir(metadata_dir):
                  changelog_dir = os.path.join(metadata_dir, locale, "changelogs")
                  if os.path.isdir(changelog_dir):
                      changelog_file = os.path.join(changelog_dir, f"{build_number}.txt")
                      with open(changelog_file, "w") as f:
                          f.write(release_body)
                      print(f"Injected release notes into: {changelog_file}")
          '


          # 2. Bridge Fastlane metadata directory to fdroid workspace to inherit store descriptions
          echo "Bridging Fastlane metadata into F-Droid repo structure..."
          # Copy to root level of F-Droid (fdroid/fastlane/metadata/android)
          mkdir -p fdroid/fastlane
          cp -r release-source/fastlane/metadata fdroid/fastlane/
          
          # Also copy to package level under fdroid/metadata/com.rfivesix.trainlibre/
          mkdir -p fdroid/metadata/com.rfivesix.trainlibre
          cp -r release-source/fastlane/metadata fdroid/metadata/com.rfivesix.trainlibre/

      - name: Copy App Store marketing screenshots
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import shutil

          source = Path("release-source/ios/fastlane/screenshots")
          resolution = "1320x2868"
          selected = {}
          for locale in ("en-US", "de-DE"):
              files = sorted((source / locale).glob(f"{resolution}_*.png"))
              if not files:
                  if locale == "en-US":
                      raise ValueError("Required English App Store marketing screenshots are missing")
                  print("No German marketing screenshots; using the English default.")
                  continue
              numbers = []
              for file in files:
                  match = re.fullmatch(rf"{resolution}_(\d+)-.+\.png", file.name)
                  if not match:
                      raise ValueError(f"Unexpected screenshot filename: {file}")
                  numbers.append(int(match.group(1)))
              if numbers != list(range(1, len(files) + 1)):
                  raise ValueError(f"Screenshot order has gaps or duplicates for {locale}: {numbers}")
              selected[locale] = files

          destinations = (
              Path("fdroid/fastlane/metadata/android"),
              Path("fdroid/metadata/com.rfivesix.trainlibre/metadata/android"),
          )
          for destination in destinations:
              # Remove only copied phone screenshots in the generated workspace.
              # Never retain old raw screenshots when a locale has no marketing set.
              for old in destination.glob("*/images/phoneScreenshots/*"):
                  if old.is_file() and old.suffix.lower() in (".png", ".jpg", ".jpeg", ".webp"):
                      old.unlink()
              for locale, files in selected.items():
                  target = destination / locale / "images/phoneScreenshots"
                  target.mkdir(parents=True, exist_ok=True)
                  for number, file in enumerate(files, 1):
                      shutil.copyfile(file, target / f"{number:02d}.png")
                  print(f"Copied {len(files)} App Store marketing screenshots ({resolution}, {locale}) to {target}")
          PY

      - name: Update F-Droid Repository Metadata
        env:
          FDROID_KEY_STORE_PASS: ${{ secrets.FDROID_KEYSTORE_PASSWORD }}
          FDROID_KEY_PASS: ${{ secrets.FDROID_KEY_PASSWORD }}
        run: |
          cd fdroid
          fdroid update --create-metadata -v

      - name: Validate generated repository
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          import zipfile

          repo = Path("fdroid/repo")
          index_bytes = (repo / "index-v2.json").read_bytes()
          index = json.loads(index_bytes)
          assert index["repo"]["address"] == "https://trainlibre.com/fdroid/repo", "Unexpected repository address"
          assert "com.rfivesix.trainlibre" in index["packages"], "Train Libre is missing from the index"
          with zipfile.ZipFile(repo / "entry.jar") as archive:
              entry = json.loads(archive.read("entry.json"))
          assert entry["index"]["name"] == "/index-v2.json", "Unexpected index path"
          assert entry["index"]["sha256"] == hashlib.sha256(index_bytes).hexdigest(), "Index hash mismatch"
          assert entry["index"]["size"] == len(index_bytes), "Index size mismatch"
          assert (repo / "index-v1.jar").is_file(), "Legacy signed index is missing"
          print("Canonical repository address and entry/index consistency verified.")
          PY

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./fdroid/repo
          publish_branch: gh-pages
          destination_dir: fdroid/repo
          keep_files: true
