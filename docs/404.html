<!doctype html>

  <title>Page not found | Train Libre</title>
  <style>
    :root { color-scheme: dark; --bg: #070807; --panel: #151815; --fg: #f4f6f4; --muted: #b0b8b0; --accent: #ddff00; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: radial-gradient(circle at top, #202620 0, var(--bg) 46%); color: var(--fg); font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    main { width: min(100%, 620px); padding: clamp(32px, 8vw, 72px); text-align: center; background: color-mix(in srgb, var(--panel) 94%, transparent); border: 1px solid rgba(221, 255, 0, .24); border-radius: 24px; box-shadow: 0 20px 70px rgba(0, 0, 0, .38); }
    .mark { width: 54px; height: 54px; display: grid; place-items: center; margin: 0 auto 28px; border: 1px solid rgba(221, 255, 0, .36); border-radius: 16px; background: #050505; }
    .mark img { width: 34px; height: 34px; }
    .code { margin: 0; color: var(--accent); font-size: .82rem; font-weight: 800; letter-spacing: .16em; }
    h1 { margin: 12px 0 14px; font-size: clamp(2rem, 6vw, 3.25rem); letter-spacing: -.04em; }
    p { max-width: 440px; margin: 0 auto; color: var(--muted); line-height: 1.6; }
    nav { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin-top: 32px; }
    a { padding: 12px 16px; border: 1px solid rgba(255, 255, 255, .16); border-radius: 10px; color: var(--fg); font-weight: 700; text-decoration: none; }
    a.primary { border-color: var(--accent); background: var(--accent); color: #121800; }
    a:hover, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <div class="mark"><img src="assets/icon-512.png" alt="Train Libre"></div>
    <p class="code">ERROR 404</p>
    <h1>Page not found</h1>
    <p>The page may have moved, or the address may be incomplete. Choose a destination below to continue.</p>
    <nav aria-label="Helpful destinations">
      <a class="primary" href="index.html">Home</a>
      <a href="docs/">Documentation</a>
      <a href="support.html">Support</a>
    </nav>
  </main>
</body>
</html>
